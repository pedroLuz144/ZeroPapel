spring.application.name=zeropapel

# Le o .env da raiz (diretorio de trabalho) como properties; opcional porque no CI e em producao
# as variaveis vem do ambiente. Variavel de ambiente real tem precedencia sobre o arquivo.
spring.config.import=optional:file:.env[.properties]

cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

server.forward-headers-strategy=native

spring.datasource.url=${URL_BD}
spring.datasource.username=${USER_BD}
spring.datasource.password=${SENHA_BD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Usuario master criado na subida, so com a tabela de usuarios vazia. Sem senha padrao.
admin.usuario=${ADMIN_USUARIO:}
admin.senha=${ADMIN_SENHA:}
admin.nome=${ADMIN_NOME:}

# Integracao iFood: credenciais do aplicativo Centralizado. Em branco, a aplicacao sobe e a
# integracao recusa pedir token.
ifood.client-id=${IFOOD_CLIENT_ID:}
ifood.client-secret=${IFOOD_CLIENT_SECRET:}
ifood.base-url=${IFOOD_BASE_URL:https://merchant-api.ifood.com.br}

# Ingestao de pedidos do iFood: desligada por padrao. Ligada, consulta os eventos a cada intervalo,
# confirma o recebimento e registra os pedidos com a forma de pagamento indicada.
ifood.polling.ativo=${IFOOD_POLLING_ATIVO:false}
ifood.polling.intervalo-ms=${IFOOD_POLLING_INTERVALO_MS:30000}
ifood.forma-de-pagamento-id=${IFOOD_FORMA_DE_PAGAMENTO_ID:}
