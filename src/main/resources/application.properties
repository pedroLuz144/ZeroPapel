spring.application.name=zeropapel

# Le o .env da raiz (diretorio de trabalho) como properties; opcional porque no CI e em producao
# as variaveis vem do ambiente. Variavel de ambiente real tem precedencia sobre o arquivo.
spring.config.import=optional:file:.env[.properties]

cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

spring.datasource.url=${URL_BD}
spring.datasource.username=${USER_BD}
spring.datasource.password=${SENHA_BD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Usuario master criado na subida, so com a tabela de usuarios vazia. Sem senha padrao.
admin.usuario=${ADMIN_USUARIO:}
admin.senha=${ADMIN_SENHA:}
admin.nome=${ADMIN_NOME:}
