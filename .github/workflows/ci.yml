name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 + MariaDB)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: zeropapel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      URL_BD: jdbc:mariadb://localhost:3306/zeropapel
      USER_BD: root
      SENHA_BD: ci-root
      JWT_SECRET: emVyb3BhcGVsLWNpLWNoYXZlLWRlLXRlc3RlLTMyYnk=
      JWT_EXPIRATION_MS: 86400000
      CORS_ALLOWED_ORIGIN: http://localhost:8080

    steps:
      - uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compilar e rodar os testes
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publicar o relatorio de testes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (Vue 3 + TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Configurar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Checagem de tipos
        run: npm run type-check

      - name: Testes
        run: npm run test:run

      - name: Build da SPA
        run: npm run build
